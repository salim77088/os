# ============================================================================
# MicroOS CI/CD Pipeline - GitHub Actions
# Builds Go API binary AND creates a bootable Alpine Linux ISO
# Uses Alpine Docker container for ISO creation (root access needed)
# ============================================================================
#
# Security: Uses GitHub Secrets (GITHUB_TOKEN). NEVER hardcode tokens.
#
# Setup:
#   1. Repo Settings → Secrets → Actions → Add MICROOS_TOKEN (optional custom PAT)
#   2. Workflow triggers on push to main/develop and version tags (v*)
#   3. Manual trigger available via workflow_dispatch
# ============================================================================

name: MicroOS Build & Release

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  MICROOS_VERSION: "0.1.0"
  ALPINE_VERSION: "3.22"
  GO_VERSION: "1.24"

permissions:
  contents: write
  packages: write

jobs:
  # ============================================================================
  # Job 1: Build Go API Binary (amd64 + arm64)
  # ============================================================================
  build-api:
    name: Build API Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: microos-server-amd64
          - goos: linux
            goarch: arm64
            output: microos-server-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        working-directory: api
        run: |
          go mod tidy
          go mod download
          go mod verify

      - name: Build static binary
        working-directory: api
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          COMMIT_HASH=${{ github.sha }}

          mkdir -p ../build/output

          go build \
            -ldflags "-s -w -X main.Version=${{ env.MICROOS_VERSION }} -X main.BuildDate=${BUILD_TIME} -X main.Commit=${COMMIT_HASH}" \
            -o ../build/output/${{ matrix.output }} \
            ./cmd/server/

      - name: Verify binary
        run: |
          file build/output/${{ matrix.output }}
          ls -lh build/output/${{ matrix.output }}

      - name: Run Go tests
        working-directory: api
        run: go test -v -short ./...

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-binary-${{ matrix.goarch }}
          path: build/output/${{ matrix.output }}
          retention-days: 5

  # ============================================================================
  # Job 2: Build Bootable Alpine Linux ISO (amd64)
  # Runs inside an Alpine Docker container with root access
  # ============================================================================
  build-iso:
    name: Build MicroOS ISO (amd64)
    runs-on: ubuntu-latest
    needs: build-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download API binary (amd64)
        uses: actions/download-artifact@v4
        with:
          name: api-binary-amd64
          path: build/output/

      - name: Build ISO in Alpine Docker container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -e MICROOS_VERSION="${{ env.MICROOS_VERSION }}" \
            -e ALPINE_VERSION="${{ env.ALPINE_VERSION }}" \
            alpine:3.22 \
            /bin/sh -c '
          set -e

          echo "============================================"
          echo " MicroOS ISO Builder v${MICROOS_VERSION}"
          echo " Building inside Alpine Docker container"
          echo "============================================"

          # Install required build tools
          apk update
          apk add --no-cache \
            xorriso \
            squashfs-tools \
            syslinux \
            grub \
            grub-bios \
            grub-efi \
            mtools \
            dosfstools \
            curl \
            cpio \
            gzip \
            xz \
            util-linux \
            e2fsprogs \
            dosfstools \
            parted \
            ca-certificates \
            bash \
            coreutils \
            findutils \
            strip

          # Configuration
          ARCH="x86_64"
          BUILD_DIR="/tmp/microos-build"
          OUTPUT_DIR="/tmp/microos-output"
          ROOTFS_DIR="${BUILD_DIR}/rootfs"
          ALPINE_MIRROR="https://dl-cdn.alpinelinux.org/alpine/v${ALPINE_VERSION}"
          ISO_NAME="microos-${MICROOS_VERSION}-x86_64.iso"
          API_BINARY="/workspace/build/output/microos-server-amd64"

          # Clean previous builds
          rm -rf "${BUILD_DIR}" "${OUTPUT_DIR}"
          mkdir -p "${BUILD_DIR}" "${OUTPUT_DIR}" "${ROOTFS_DIR}"

          # ==========================================
          # Step 1: Download and extract Alpine minirootfs
          # ==========================================
          echo "[1/9] Downloading Alpine minirootfs..."
          MINIROOTFS_URL="${ALPINE_MIRROR}/releases/${ARCH}/alpine-minirootfs-${ALPINE_VERSION}.0-${ARCH}.tar.gz"
          curl -fsSL "${MINIROOTFS_URL}" | tar -xz -C "${ROOTFS_DIR}"
          echo "[1/9] Minirootfs extracted (~3MB base)"

          # ==========================================
          # Step 2: Configure APK repositories
          # ==========================================
          echo "[2/9] Configuring APK repositories..."
          mkdir -p "${ROOTFS_DIR}/etc/apk"
          echo "${ALPINE_MIRROR}/main" > "${ROOTFS_DIR}/etc/apk/repositories"
          echo "${ALPINE_MIRROR}/community" >> "${ROOTFS_DIR}/etc/apk/repositories"

          # Copy resolv.conf for DNS resolution inside rootfs
          cp /etc/resolv.conf "${ROOTFS_DIR}/etc/resolv.conf"

          # ==========================================
          # Step 3: Install minimal packages
          # ==========================================
          echo "[3/9] Installing minimal packages..."
          apk --root "${ROOTFS_DIR}" --no-cache --no-progress add \
            alpine-base \
            openrc \
            eudev \
            dbus \
            linux-virt \
            linux-firmware-none \
            iptables \
            iproute2 \
            bridge-utils \
            curl \
            ca-certificates \
            bind-tools \
            util-linux \
            e2fsprogs \
            dosfstools \
            parted \
            busybox-initscripts \
            mesa \
            mesa-va-gallium \
            mesa-vulkan-intel \
            mesa-vulkan-radeon \
            vulkan-loader \
            vulkan-tools \
            libva \
            intel-media-driver \
            ffmpeg \
            ffmpeg-libs \
            openssl \
            tzdata \
            musl \
            musl-utils

          echo "[3/9] Packages installed"

          # ==========================================
          # Step 4: Strip rootfs for size reduction
          # ==========================================
          echo "[4/9] Stripping rootfs..."
          # Remove docs
          find "${ROOTFS_DIR}" -type f -name "*.md" -delete 2>/dev/null || true
          find "${ROOTFS_DIR}" -type f -name "*.txt" -delete 2>/dev/null || true
          find "${ROOTFS_DIR}" -type f -name "*.html" -delete 2>/dev/null || true
          find "${ROOTFS_DIR}" -type d -name "man" -exec rm -rf {} + 2>/dev/null || true
          find "${ROOTFS_DIR}" -type d -name "doc" -exec rm -rf {} + 2>/dev/null || true
          find "${ROOTFS_DIR}" -type d -name "info" -exec rm -rf {} + 2>/dev/null || true

          # Remove non-essential locales
          find "${ROOTFS_DIR}/usr/share/locale" -mindepth 1 -maxdepth 1 -type d \
            ! -name "C" ! -name "en*" ! -name "locale.alias" -exec rm -rf {} + 2>/dev/null || true

          # Remove unused firmware
          rm -rf "${ROOTFS_DIR}/lib/firmware/cirrus" 2>/dev/null || true
          rm -rf "${ROOTFS_DIR}/lib/firmware/rtl*" 2>/dev/null || true
          rm -rf "${ROOTFS_DIR}/lib/firmware/bnx2" 2>/dev/null || true
          rm -rf "${ROOTFS_DIR}/lib/firmware/amd-ucode" 2>/dev/null || true
          rm -rf "${ROOTFS_DIR}/lib/firmware/intel-ucode" 2>/dev/null || true

          # Remove development files
          find "${ROOTFS_DIR}" -type f -name "*.a" -delete 2>/dev/null || true
          find "${ROOTFS_DIR}" -type f -name "*.la" -delete 2>/dev/null || true
          find "${ROOTFS_DIR}" -type d -name "include" -exec rm -rf {} + 2>/dev/null || true
          rm -rf "${ROOTFS_DIR}/usr/share/pkgconfig" 2>/dev/null || true

          # Remove unused X/Wayland stuff
          rm -rf "${ROOTFS_DIR}/usr/share/X11" 2>/dev/null || true
          rm -rf "${ROOTFS_DIR}/usr/share/wayland" 2>/dev/null || true

          # Strip ELF binaries
          find "${ROOTFS_DIR}" -type f -executable -exec sh -c "file \"\$1\" | grep -q ELF && strip --strip-all \"\$1\" 2>/dev/null || true" _ {} \;

          # Remove APK cache
          rm -rf "${ROOTFS_DIR}/var/cache/apk" 2>/dev/null || true
          rm -rf "${ROOTFS_DIR}/etc/apk/cache" 2>/dev/null || true

          # Strip unused kernel modules
          KMOD_DIR="${ROOTFS_DIR}/lib/modules"
          if [ -d "${KMOD_DIR}" ]; then
            for pattern in sound bluetooth irda isdn phone hamradio; do
              find "${KMOD_DIR}" -path "*/${pattern}/*" -type f -delete 2>/dev/null || true
            done
          fi

          echo "[4/9] Rootfs stripped"

          # ==========================================
          # Step 5: Inject MicroOS API binary
          # ==========================================
          echo "[5/9] Injecting API binary..."
          mkdir -p "${ROOTFS_DIR}/opt/microos/bin"
          mkdir -p "${ROOTFS_DIR}/var/lib/microos/videos"
          mkdir -p "${ROOTFS_DIR}/var/lib/microos/hls"
          mkdir -p "${ROOTFS_DIR}/var/lib/microos/dash"
          mkdir -p "${ROOTFS_DIR}/var/lib/microos/tmp"
          mkdir -p "${ROOTFS_DIR}/var/log/microos"
          mkdir -p "${ROOTFS_DIR}/etc/microos"
          mkdir -p "${ROOTFS_DIR}/etc/init.d"
          mkdir -p "${ROOTFS_DIR}/etc/network"

          if [ -f "${API_BINARY}" ]; then
            cp "${API_BINARY}" "${ROOTFS_DIR}/opt/microos/bin/microos-server"
            chmod +x "${ROOTFS_DIR}/opt/microos/bin/microos-server"
            echo "[5/9] API binary injected ($(stat -c%s "${API_BINARY}" | awk '{printf "%.1fMB", $1/1048576}'))"
          else
            echo "[5/9] WARNING: API binary not found!"
          fi

          # Copy configuration files from repo
          cp /workspace/build/rootfs/etc/microos/config.toml "${ROOTFS_DIR}/etc/microos/"
          cp /workspace/build/rootfs/etc/init.d/microos "${ROOTFS_DIR}/etc/init.d/"
          chmod +x "${ROOTFS_DIR}/etc/init.d/microos"
          cp /workspace/build/rootfs/etc/network/interfaces "${ROOTFS_DIR}/etc/network/"

          # ==========================================
          # Step 6: Configure system services
          # ==========================================
          echo "[6/9] Configuring system services..."

          # Hostname
          echo "microos" > "${ROOTFS_DIR}/etc/hostname"
          echo "127.0.0.1 microos localhost" > "${ROOTFS_DIR}/etc/hosts"

          # DNS
          echo "nameserver 8.8.8.8" > "${ROOTFS_DIR}/etc/resolv.conf"
          echo "nameserver 8.8.4.4" >> "${ROOTFS_DIR}/etc/resolv.conf"
          echo "nameserver 1.1.1.1" >> "${ROOTFS_DIR}/etc/resolv.conf"

          # fstab for immutable operation
          cat > "${ROOTFS_DIR}/etc/fstab" << FSTABEOF
          # MicroOS Immutable Filesystem
          tmpfs / tmpfs defaults,size=200M,mode=0755 0 0
          tmpfs /var/lib/microos tmpfs defaults,size=90% 0 0
          tmpfs /var/log tmpfs defaults,size=10M 0 0
          tmpfs /tmp tmpfs defaults,size=50M 0 0
          FSTABEOF

          # Release info
          cat > "${ROOTFS_DIR}/etc/microos/release" << RELEOF
          MICROOS_VERSION=${MICROOS_VERSION}
          MICROOS_BASE=alpine-v${ALPINE_VERSION}
          MICROOS_KERNEL=linux-virt
          MICROOS_TYPE=headless-immutable
          RELEOF

          # OpenRC services
          chroot "${ROOTFS_DIR}" /sbin/rc-update add boot sysinit 2>/dev/null || true
          chroot "${ROOTFS_DIR}" /sbin/rc-update add udev sysinit 2>/dev/null || true
          chroot "${ROOTFS_DIR}" /sbin/rc-update add networking boot 2>/dev/null || true
          chroot "${ROOTFS_DIR}" /sbin/rc-update add hostname boot 2>/dev/null || true
          chroot "${ROOTFS_DIR}" /sbin/rc-update add dbus default 2>/dev/null || true
          chroot "${ROOTFS_DIR}" /sbin/rc-update add microos default 2>/dev/null || true

          echo "[6/9] System services configured"

          # ==========================================
          # Step 7: Create initramfs
          # ==========================================
          echo "[7/9] Creating initramfs..."
          cd "${ROOTFS_DIR}"
          find . | cpio -o -H newc 2>/dev/null | gzip -9 > "${BUILD_DIR}/initramfs-virt.gz"
          cd /tmp

          INITRAMFS_SIZE=$(stat -c%s "${BUILD_DIR}/initramfs-virt.gz" | awk '{printf "%.1fMB", $1/1048576}')
          echo "[7/9] Initramfs created: ${INITRAMFS_SIZE}"

          # ==========================================
          # Step 8: Prepare ISO directory structure
          # ==========================================
          echo "[8/9] Preparing ISO structure..."
          ISO_DIR="${BUILD_DIR}/iso"
          mkdir -p "${ISO_DIR}/boot/grub" "${ISO_DIR}/boot/syslinux"

          # Copy kernel
          if [ -f "${ROOTFS_DIR}/boot/vmlinuz-virt" ]; then
            cp "${ROOTFS_DIR}/boot/vmlinuz-virt" "${ISO_DIR}/boot/vmlinuz-virt"
          else
            # Find the kernel in rootfs
            VMLINUZ=$(find "${ROOTFS_DIR}/boot" -name "vmlinuz*" | head -1)
            if [ -n "${VMLINUZ}" ]; then
              cp "${VMLINUZ}" "${ISO_DIR}/boot/vmlinuz-virt"
            else
              echo "ERROR: Kernel not found in rootfs!"
              find "${ROOTFS_DIR}/boot" -type f
              exit 1
            fi
          fi

          # Copy initramfs
          cp "${BUILD_DIR}/initramfs-virt.gz" "${ISO_DIR}/boot/initramfs-virt"

          # GRUB config for UEFI boot
          cat > "${ISO_DIR}/boot/grub/grub.cfg" << GRUBEOF
          set default=0
          set timeout=3

          menuentry "MicroOS Video Streaming Server" {
              linux /boot/vmlinuz-virt root=/dev/ram0 init=/sbin/init console=tty0 console=ttyS0,115200n8 quiet
              initrd /boot/initramfs-virt
          }

          menuentry "MicroOS (SCALE - In-Memory 200MB)" {
              linux /boot/vmlinuz-virt root=/dev/ram0 init=/sbin/init console=tty0 console=ttyS0,115200n8 quiet ramdisk_size=200000
              initrd /boot/initramfs-virt
          }

          menuentry "MicroOS (Safe Mode)" {
              linux /boot/vmlinuz-virt root=/dev/ram0 init=/sbin/init console=tty0 console=ttyS0,115200n8
              initrd /boot/initramfs-virt
          }

          menuentry "MicroOS (GPU Debug)" {
              linux /boot/vmlinuz-virt root=/dev/ram0 init=/sbin/init console=tty0 console=ttyS0,115200n8 drm.debug=0x04 log_buf_len=16M
              initrd /boot/initramfs-virt
          }
          GRUBEOF

          # Syslinux config for BIOS boot
          cat > "${ISO_DIR}/boot/syslinux/syslinux.cfg" << SYSLINUXEOF
          DEFAULT microos
          PROMPT 0
          TIMEOUT 3

          LABEL microos
              MENU LABEL MicroOS Video Streaming Server
              KERNEL /boot/vmlinuz-virt
              INITRD /boot/initramfs-virt
              APPEND root=/dev/ram0 init=/sbin/init console=tty0 console=ttyS0,115200n8 quiet

          LABEL microos-scale
              MENU LABEL MicroOS (SCALE - In-Memory)
              KERNEL /boot/vmlinuz-virt
              INITRD /boot/initramfs-virt
              APPEND root=/dev/ram0 init=/sbin/init console=tty0 console=ttyS0,115200n8 quiet ramdisk_size=200000

          LABEL microos-debug
              MENU LABEL MicroOS (Debug Mode)
              KERNEL /boot/vmlinuz-virt
              INITRD /boot/initramfs-virt
              APPEND root=/dev/ram0 init=/sbin/init console=tty0 console=ttyS0,115200n8 drm.debug=0x04
          SYSLINUXEOF

          # Copy syslinux boot files
          for file in ldlinux.c32 libcom32.c32 libutil.c32 menu.c32 vesamenu.c32 mboot.c32; do
            cp "/usr/share/syslinux/${file}" "${ISO_DIR}/boot/syslinux/" 2>/dev/null || true
          done
          cp "/usr/share/syslinux/isolinux.bin" "${ISO_DIR}/boot/syslinux/" 2>/dev/null || true

          # Create EFI boot image for UEFI support
          EFI_DIR="${BUILD_DIR}/efi"
          mkdir -p "${EFI_DIR}/EFI/BOOT"
          cp "/usr/share/grub/x86_64-efi/grub.efi" "${EFI_DIR}/EFI/BOOT/bootx64.efi" 2>/dev/null || \
          cp "/usr/lib/grub/x86_64-efi/grub.efi" "${EFI_DIR}/EFI/BOOT/bootx64.efi" 2>/dev/null || true

          # Create EFI FAT image
          dd if=/dev/zero of="${ISO_DIR}/boot/grub/efi.img" bs=1M count=4 2>/dev/null
          mkfs.vfat "${ISO_DIR}/boot/grub/efi.img" 2>/dev/null || mformat -i "${ISO_DIR}/boot/grub/efi.img" :: 2>/dev/null || true
          mcopy -i "${ISO_DIR}/boot/grub/efi.img" "${EFI_DIR}/EFI" ::EFI 2>/dev/null || \
          true

          echo "[8/9] ISO directory prepared"

          # ==========================================
          # Step 9: Build ISO with xorriso
          # ==========================================
          echo "[9/9] Building bootable ISO..."
          xorriso -as mkisofs \
            -iso-level 3 \
            -full-iso9660-filenames \
            -R -J \
            -c boot/syslinux/boot.cat \
            -b boot/syslinux/isolinux.bin \
            -no-emul-boot \
            -boot-load-size 4 \
            -boot-info-table \
            --efi-boot boot/grub/efi.img \
            -eltorito-alt-boot \
            -e boot/grub/efi.img \
            -no-emul-boot \
            -V "MICROOS_${MICROOS_VERSION}" \
            -o "${OUTPUT_DIR}/${ISO_NAME}" \
            "${ISO_DIR}" 2>&1

          # Verify ISO was created
          if [ ! -f "${OUTPUT_DIR}/${ISO_NAME}" ]; then
            echo "ERROR: ISO creation failed!"
            exit 1
          fi

          ISO_SIZE=$(stat -c%s "${OUTPUT_DIR}/${ISO_NAME}")
          ISO_SIZE_MB=$((ISO_SIZE / 1024 / 1024))

          echo ""
          echo "============================================"
          echo " MicroOS ISO Build Complete!"
          echo "============================================"
          echo " ISO: ${ISO_NAME}"
          echo " Size: ${ISO_SIZE_MB}MB"
          if [ "${ISO_SIZE_MB}" -le 200 ]; then
            echo " PASS: Under 200MB target"
          else
            echo " WARN: Exceeds 200MB target"
          fi
          echo "============================================"

          # Copy ISO to workspace for artifact upload
          cp "${OUTPUT_DIR}/${ISO_NAME}" /workspace/build/output/microos-${MICROOS_VERSION}-x86_64.iso
          '

      - name: Verify ISO
        run: |
          ls -lh build/output/microos-*.iso
          file build/output/microos-*.iso
          echo "ISO build complete!"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: microos-iso-amd64
          path: build/output/microos-*.iso
          retention-days: 30

  # ============================================================================
  # Job 3: Build ARM64 rootfs overlay (for ARM servers)
  # ============================================================================
  build-iso-arm64:
    name: Build MicroOS ISO (arm64)
    runs-on: ubuntu-latest
    needs: build-api
    # Only build ARM64 ISO on version tags (save CI resources)
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download API binary (arm64)
        uses: actions/download-artifact@v4
        with:
          name: api-binary-arm64
          path: build/output/

      - name: Build ARM64 rootfs overlay tarball
        run: |
          mkdir -p /tmp/microos-overlay/opt/microos/bin
          mkdir -p /tmp/microos-overlay/var/lib/microos/videos
          mkdir -p /tmp/microos-overlay/var/lib/microos/hls
          mkdir -p /tmp/microos-overlay/var/lib/microos/dash
          mkdir -p /tmp/microos-overlay/var/lib/microos/tmp
          mkdir -p /tmp/microos-overlay/var/log/microos
          mkdir -p /tmp/microos-overlay/etc/microos
          mkdir -p /tmp/microos-overlay/etc/init.d
          mkdir -p /tmp/microos-overlay/etc/network

          cp build/output/microos-server-arm64 /tmp/microos-overlay/opt/microos/bin/microos-server
          chmod +x /tmp/microos-overlay/opt/microos/bin/microos-server
          cp build/rootfs/etc/microos/config.toml /tmp/microos-overlay/etc/microos/
          cp build/rootfs/etc/init.d/microos /tmp/microos-overlay/etc/init.d/
          chmod +x /tmp/microos-overlay/etc/init.d/microos
          cp build/rootfs/etc/network/interfaces /tmp/microos-overlay/etc/network/

          cd /tmp/microos-overlay
          tar -czf microos-overlay-${{ env.MICROOS_VERSION }}-aarch64.tar.gz opt/ var/ etc/

          mkdir -p build/output
          cp /tmp/microos-overlay/microos-overlay-*.tar.gz build/output/

      - name: Upload ARM64 overlay artifact
        uses: actions/upload-artifact@v4
        with:
          name: microos-overlay-arm64
          path: build/output/microos-overlay-*.tar.gz
          retention-days: 30

  # ============================================================================
  # Job 4: Publish GitHub Release (on version tags only)
  # ============================================================================
  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-api, build-iso]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: List release artifacts
        run: find release-artifacts -type f -ls

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: "MicroOS ${{ github.ref_name }}"
          body: |
            ## MicroOS Video Streaming Server ${{ github.ref_name }}

            ### What's New
            - Ultra-light headless OS for video hosting & streaming
            - Bootable ISO under 200MB, RAM under 200MB at idle
            - GPU-accelerated transcoding (VA-API, NVENC, Vulkan AV1)
            - HLS/DASH adaptive streaming with multi-resolution ladder
            - Single Go static binary API for complete management

            ### Downloads

            | Architecture | ISO | API Binary |
            |-------------|-----|-----------|
            | x86_64 (amd64) | `microos-${{ env.MICROOS_VERSION }}-x86_64.iso` | `microos-server-amd64` |
            | ARM64 (aarch64) | Overlay tarball (apply on Alpine ARM64 host) | `microos-server-arm64` |

            ### Quick Start
            ```bash
            # Flash ISO to USB
            dd if=microos-*.iso of=/dev/sdX bs=4M status=progress

            # Boot the USB on your server
            # MicroOS starts automatically — API on port 8080

            # Upload a video
            curl -X POST http://your-server:8080/api/v1/upload \
              -F "video=@your-video.mp4"

            # Get streaming URLs
            curl http://your-server:8080/api/v1/videos/{id}/stream
            ```

            ### API Endpoints
            | Method | Path | Description |
            |--------|------|-------------|
            | POST | `/api/v1/upload` | Upload video file |
            | GET | `/api/v1/videos` | List all videos |
            | GET | `/api/v1/videos/{id}` | Get video details |
            | GET | `/api/v1/videos/{id}/stream` | Get HLS/DASH streaming URLs |
            | GET | `/api/v1/videos/{id}/status` | Get transcoding progress |
            | DELETE | `/api/v1/videos/{id}` | Delete video |
            | GET | `/api/v1/health` | Health check |
            | GET | `/api/v1/system` | System info (RAM, GPU, disk) |

            ### System Requirements
            - Minimum RAM: 256MB (200MB OS + 56MB headroom)
            - Recommended: 1GB+ for concurrent transcoding
            - GPU: Optional (Intel/AMD VA-API, NVIDIA NVENC, Vulkan AV1)
            - Storage: 10GB+ for video library

            ### Boot Modes
            - **Normal**: Standard headless server mode
            - **SCALE**: In-memory mode (200MB RAM limit, tmpfs rootfs)
            - **Safe Mode**: No quiet mode, full console output
            - **GPU Debug**: DRM debug logging for GPU troubleshooting
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          files: |
            release-artifacts/microos-iso-amd64/*
            release-artifacts/api-binary-amd64/*
            release-artifacts/api-binary-arm64/*

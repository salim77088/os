# ============================================================================
# MicroOS CI/CD Pipeline - GitHub Actions
# Automatically builds the Go API, creates Alpine rootfs, and generates ISO
# ============================================================================
#
# Security Note: This workflow uses GitHub Secrets for sensitive tokens.
# NEVER hardcode tokens in workflow files. Use secrets like:
#   - ${{ secrets.GITHUB_TOKEN }} (automatic)
#   - ${{ secrets.MICROOS_TOKEN }} (custom secret you create)
#
# Setup Instructions:
#   1. Go to your repo Settings → Secrets → Actions
#   2. Add a secret named "MICROOS_TOKEN" with your GitHub PAT
#   3. The workflow will use this for publishing releases
# ============================================================================

name: MicroOS Build & Release

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggers

env:
  MICROOS_VERSION: "0.1.0"
  ALPINE_VERSION: "3.22"
  GO_VERSION: "1.24"

permissions:
  contents: write
  packages: write

jobs:
  # ============================================================================
  # Job 1: Build Go API Binary
  # ============================================================================
  build-api:
    name: Build API Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: microos-server-amd64
          - goos: linux
            goarch: arm64
            output: microos-server-arm64
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      
      - name: Download dependencies
        working-directory: api
        run: |
          go mod tidy
          go mod download
          go mod verify
      
      - name: Build static binary
        working-directory: api
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          COMMIT_HASH=${{ github.sha }}
          
          go build \
            -ldflags "-s -w -X main.Version=${{ env.MICROOS_VERSION }} -X main.BuildDate=${BUILD_TIME} -X main.Commit=${COMMIT_HASH}" \
            -o ../build/output/${{ matrix.output }} \
            ./cmd/server/
      
      - name: Verify binary
        run: |
          file build/output/${{ matrix.output }}
          ls -lh build/output/${{ matrix.output }}
      
      - name: Run tests
        working-directory: api
        run: go test -v -short ./...
      
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-binary-${{ matrix.goarch }}
          path: build/output/${{ matrix.output }}
          retention-days: 5

  # ============================================================================
  # Job 2: Build Alpine Linux ISO
  # ============================================================================
  build-iso:
    name: Build MicroOS ISO
    runs-on: ubuntu-latest
    needs: build-api
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download API binary (amd64)
        uses: actions/download-artifact@v4
        with:
          name: api-binary-amd64
          path: build/output/
      
      - name: Setup Alpine Linux build environment
        uses: jirutka/setup-alpine@v1
        with:
          arch: x86_64
          packages: >
            apk-tools
            xorriso
            squashfs-tools
            syslinux
            grub
            grub-bios
            grub-efi
            mtools
            dosfstools
            curl
            cpio
            gzip
      
      - name: Build MicroOS rootfs tarball
        shell: alpine.sh {0}
        run: |
          # Build rootfs tarball with API binary for local ISO generation
          API_BINARY="./build/output/microos-server-amd64"
          OUTPUT_DIR="/tmp/microos-output"
          mkdir -p "${OUTPUT_DIR}"
          
          # Inject API binary into rootfs overlay
          mkdir -p "${OUTPUT_DIR}/opt/microos/bin"
          mkdir -p "${OUTPUT_DIR}/var/lib/microos/videos"
          mkdir -p "${OUTPUT_DIR}/var/lib/microos/hls"
          mkdir -p "${OUTPUT_DIR}/var/lib/microos/dash"
          mkdir -p "${OUTPUT_DIR}/var/lib/microos/tmp"
          mkdir -p "${OUTPUT_DIR}/var/log/microos"
          mkdir -p "${OUTPUT_DIR}/etc/microos"
          mkdir -p "${OUTPUT_DIR}/etc/init.d"
          mkdir -p "${OUTPUT_DIR}/etc/network"
          
          if [ -f "${API_BINARY}" ]; then
            cp "${API_BINARY}" "${OUTPUT_DIR}/opt/microos/bin/microos-server"
            chmod +x "${OUTPUT_DIR}/opt/microos/bin/microos-server"
          fi
          
          # Copy configuration files
          cp ./build/rootfs/etc/microos/config.toml "${OUTPUT_DIR}/etc/microos/"
          cp ./build/rootfs/etc/init.d/microos "${OUTPUT_DIR}/etc/init.d/"
          chmod +x "${OUTPUT_DIR}/etc/init.d/microos"
          cp ./build/rootfs/etc/network/interfaces "${OUTPUT_DIR}/etc/network/"
          
          # Create rootfs overlay tarball
          cd "${OUTPUT_DIR}"
          tar -czf microos-overlay-0.1.0-x86_64.tar.gz opt/ var/ etc/
          cd -
          
          echo "Rootfs overlay created: microos-overlay-0.1.0-x86_64.tar.gz"
          echo "To build a full ISO, run scripts/build-iso.sh on an Alpine Linux server"
          echo "The overlay tarball can be extracted into the rootfs during ISO build"
      
      - name: Upload rootfs overlay artifact
        uses: actions/upload-artifact@v4
        with:
          name: microos-rootfs-overlay-amd64
          path: /tmp/microos-output/microos-overlay-0.1.0-x86_64.tar.gz
          retention-days: 30

  # ============================================================================
  # Job 3: Publish Release (on version tags only)
  # ============================================================================
  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-api, build-iso]
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: "MicroOS ${{ github.ref_name }}"
          body: |
            ## MicroOS Video Streaming Server ${{ github.ref_name }}
            
            ### 🎯 What's New
            - Ultra-light headless OS for video hosting & streaming
            - ISO size under 200MB, RAM consumption under 200MB
            - GPU-accelerated transcoding (VA-API, NVENC, Vulkan AV1)
            - HLS/DASH adaptive streaming support
            - Single Go binary API for complete management
            
            ### 📦 Downloads
            
            | Architecture | ISO | API Binary |
            |-------------|-----|-----------|
            | x86_64 | `microos-${{ env.MICROOS_VERSION }}-x86_64.iso` | `microos-server-amd64` |
            | ARM64 | `microos-${{ env.MICROOS_VERSION }}-aarch64.iso` | `microos-server-arm64` |
            
            ### 🚀 Quick Start
            ```bash
            # Download and flash ISO to USB
            dd if=microos-*.iso of=/dev/sdX bs=4M
            
            # Boot the USB on your server
            # MicroOS starts automatically with API on port 8080
            
            # Upload a video
            curl -X POST http://your-server:8080/api/v1/upload \
              -F "video=@your-video.mp4"
            
            # Get streaming URL
            curl http://your-server:8080/api/v1/videos/{id}/stream
            ```
            
            ### ⚙️ System Requirements
            - Minimum RAM: 256MB (200MB OS + 56MB for processing)
            - Recommended: 1GB+ for concurrent transcoding
            - GPU: Optional (Intel/AMD VA-API, NVIDIA NVENC, Vulkan)
            - Storage: 10GB+ for video library
            
            ---
            Built with ❤️ for video hosting companies, data centers, and streaming platforms.
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          files: |
            release-artifacts/microos-iso-amd64/*
            release-artifacts/api-binary-amd64/*
            release-artifacts/api-binary-arm64/*

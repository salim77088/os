# ============================================================================
# MicroOS CI/CD Pipeline - GitHub Actions
# Automatically builds the Go API, creates Alpine rootfs, and generates ISO
# ============================================================================
#
# Security Note: This workflow uses GitHub Secrets for sensitive tokens.
# NEVER hardcode tokens in workflow files. Use secrets like:
#   - ${{ secrets.GITHUB_TOKEN }} (automatic)
#   - ${{ secrets.MICROOS_TOKEN }} (custom secret you create)
#
# Setup Instructions:
#   1. Go to your repo Settings → Secrets → Actions
#   2. Add a secret named "MICROOS_TOKEN" with your GitHub PAT
#   3. The workflow will use this for publishing releases
# ============================================================================

name: MicroOS Build & Release

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggers

env:
  MICROOS_VERSION: "0.1.0"
  ALPINE_VERSION: "3.22"
  GO_VERSION: "1.24"

permissions:
  contents: write
  packages: write

jobs:
  # ============================================================================
  # Job 1: Build Go API Binary
  # ============================================================================
  build-api:
    name: Build API Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: microos-server-amd64
          - goos: linux
            goarch: arm64
            output: microos-server-arm64
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      
      - name: Download dependencies
        working-directory: api
        run: |
          go mod tidy
          go mod download
          go mod verify
      
      - name: Build static binary
        working-directory: api
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          COMMIT_HASH=${{ github.sha }}
          
          go build \
            -ldflags "-s -w -X main.Version=${{ env.MICROOS_VERSION }} -X main.BuildDate=${BUILD_TIME} -X main.Commit=${COMMIT_HASH}" \
            -o ../build/output/${{ matrix.output }} \
            ./cmd/server/
      
      - name: Verify binary
        run: |
          file build/output/${{ matrix.output }}
          ls -lh build/output/${{ matrix.output }}
      
      - name: Run tests
        working-directory: api
        run: go test -v -short ./...
      
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-binary-${{ matrix.goarch }}
          path: build/output/${{ matrix.output }}
          retention-days: 5

  # ============================================================================
  # Job 2: Build Alpine Linux ISO
  # ============================================================================
  build-iso:
    name: Build MicroOS ISO
    runs-on: ubuntu-latest
    needs: build-api
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download API binary (amd64)
        uses: actions/download-artifact@v4
        with:
          name: api-binary-amd64
          path: build/output/
      
      - name: Setup Alpine Linux build environment
        uses: jirutka/setup-alpine@v1
        with:
          arch: x86_64
          packages: >
            apk-tools
            xorriso
            squashfs-tools
            syslinux
            grub
            grub-bios
            grub-efi
            mtools
            dosfstools
            curl
            cpio
            gzip
      
      - name: Build MicroOS rootfs and ISO
        shell: alpine.sh {0}
        run: |
          # Set API binary path for ISO injection
          API_BINARY="./build/output/microos-server-amd64"
          
          # Build minimal rootfs using Alpine minirootfs
          MINIROOTFS_URL="https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/x86_64/alpine-minirootfs-3.22.0-x86_64.tar.gz"
          BUILD_DIR="/tmp/microos-build"
          ROOTFS_DIR="${BUILD_DIR}/rootfs"
          OUTPUT_DIR="/tmp/microos-output"
          
          rm -rf "${BUILD_DIR}" "${OUTPUT_DIR}"
          mkdir -p "${BUILD_DIR}" "${OUTPUT_DIR}" "${ROOTFS_DIR}"
          
          # Download and extract minirootfs (~3MB!)
          curl -fsSL "${MINIROOTFS_URL}" | tar -xz -C "${ROOTFS_DIR}"
          
          # Configure APK repositories
          mkdir -p "${ROOTFS_DIR}/etc/apk"
          printf "https://dl-cdn.alpinelinux.org/alpine/v3.22/main\nhttps://dl-cdn.alpinelinux.org/alpine/v3.22/community\n" > "${ROOTFS_DIR}/etc/apk/repositories"
          
          # Install minimal essential packages only
          apk --root "${ROOTFS_DIR}" --no-cache --allow-untrusted add \
            alpine-base openrc eudev dbus linux-virt \
            iptables iproute2 bridge-utils curl ca-certificates \
            util-linux e2fsprogs openssl musl musl-utils \
            mesa mesa-va-gallium libva intel-media-driver \
            ffmpeg ffmpeg-libs \
            dbus busybox-initscripts
          
          # Strip rootfs for size reduction
          find "${ROOTFS_DIR}" -type f -name "*.md" -delete 2>/dev/null || true
          find "${ROOTFS_DIR}" -type f -name "*.html" -delete 2>/dev/null || true
          find "${ROOTFS_DIR}" -type d -name "man" -exec rm -rf {} + 2>/dev/null || true
          find "${ROOTFS_DIR}" -type d -name "doc" -exec rm -rf {} + 2>/dev/null || true
          find "${ROOTFS_DIR}" -type f -name "*.a" -delete 2>/dev/null || true
          find "${ROOTFS_DIR}" -type f \( -name "*.so" -o -name "*.so.*" \) ! -path "*/lib/*" ! -path "*/usr/lib/*" -delete 2>/dev/null || true
          rm -rf "${ROOTFS_DIR}/var/cache/apk" 2>/dev/null || true
          
          # Inject API binary
          mkdir -p "${ROOTFS_DIR}/opt/microos/bin"
          mkdir -p "${ROOTFS_DIR}/var/lib/microos/videos"
          mkdir -p "${ROOTFS_DIR}/var/lib/microos/hls"
          mkdir -p "${ROOTFS_DIR}/var/lib/microos/dash"
          mkdir -p "${ROOTFS_DIR}/var/lib/microos/tmp"
          mkdir -p "${ROOTFS_DIR}/var/log/microos"
          
          if [ -f "${API_BINARY}" ]; then
            cp "${API_BINARY}" "${ROOTFS_DIR}/opt/microos/bin/microos-server"
            chmod +x "${ROOTFS_DIR}/opt/microos/bin/microos-server"
            echo "API binary injected"
          fi
          
          # Copy configuration and init script from repository
          mkdir -p "${ROOTFS_DIR}/etc/microos"
          mkdir -p "${ROOTFS_DIR}/etc/init.d"
          mkdir -p "${ROOTFS_DIR}/etc/network"
          cp ./build/rootfs/etc/microos/config.toml "${ROOTFS_DIR}/etc/microos/config.toml"
          cp ./build/rootfs/etc/init.d/microos "${ROOTFS_DIR}/etc/init.d/microos"
          chmod +x "${ROOTFS_DIR}/etc/init.d/microos"
          cp ./build/rootfs/etc/network/interfaces "${ROOTFS_DIR}/etc/network/interfaces"
          
          # Configure system
          echo "microos" > "${ROOTFS_DIR}/etc/hostname"
          echo "127.0.0.1 microos localhost" > "${ROOTFS_DIR}/etc/hosts"
          printf "nameserver 8.8.8.8\nnameserver 8.8.4.4\n" > "${ROOTFS_DIR}/etc/resolv.conf"
          
          # Configure OpenRC services
          chroot "${ROOTFS_DIR}" /sbin/rc-update add networking boot || true
          chroot "${ROOTFS_DIR}" /sbin/rc-update add hostname boot || true
          chroot "${ROOTFS_DIR}" /sbin/rc-update add dbus default || true
          chroot "${ROOTFS_DIR}" /sbin/rc-update add microos default || true
          
          # Create release info
          echo "MICROOS_VERSION=0.1.0" > "${ROOTFS_DIR}/etc/microos/release"
          
          # Report rootfs size
          ROOTFS_SIZE=$(du -sm "${ROOTFS_DIR}" | cut -f1)
          echo "Rootfs size: ${ROOTFS_SIZE}MB"
          
          # Create initramfs
          cd "${ROOTFS_DIR}"
          find . | cpio -o -H newc 2>/dev/null | gzip -9 > "${BUILD_DIR}/initramfs-virt.gz"
          cd -
          
          # Prepare ISO directory structure
          ISO_DIR="${BUILD_DIR}/iso"
          mkdir -p "${ISO_DIR}/boot/grub" "${ISO_DIR}/boot/syslinux"
          
          # Copy kernel from rootfs
          if [ -f "${ROOTFS_DIR}/boot/vmlinuz-virt" ]; then
            cp "${ROOTFS_DIR}/boot/vmlinuz-virt" "${ISO_DIR}/boot/"
          fi
          cp "${BUILD_DIR}/initramfs-virt.gz" "${ISO_DIR}/boot/initramfs-virt"
          
          # Create GRUB configuration
          cat > "${ISO_DIR}/boot/grub/grub.cfg" << 'GRUBEOF'
          set default=0
          set timeout=3
          menuentry "MicroOS Video Streaming Server" {
            linux /boot/vmlinuz-virt root=/dev/ram0 console=tty0 console=ttyS0,115200n8 quiet
            initrd /boot/initramfs-virt
          }
          GRUBEOF
          
          # Create syslinux configuration
          cat > "${ISO_DIR}/boot/syslinux/syslinux.cfg" << 'SYSEOF'
          DEFAULT microos
          PROMPT 0
          TIMEOUT 3
          LABEL microos
            KERNEL /boot/vmlinuz-virt
            INITRD /boot/initramfs-virt
            APPEND root=/dev/ram0 console=tty0 console=ttyS0,115200n8 quiet
          SYSEOF
          
          # Copy syslinux boot files
          for f in ldlinux.c32 libcom32.c32 libutil.c32 menu.c32 isolinux.bin; do
            find / -name "$f" -exec cp {} "${ISO_DIR}/boot/syslinux/" \; 2>/dev/null || true
          done
          
          # Build ISO
          xorriso -as mkisofs \
            -iso-level 3 \
            -R -J \
            -b boot/syslinux/isolinux.bin \
            -no-emul-boot \
            -boot-load-size 4 \
            -boot-info-table \
            -V "MICROOS_0.1.0" \
            -o "${OUTPUT_DIR}/microos-0.1.0-x86_64.iso" \
            "${ISO_DIR}" 2>&1 || echo "ISO build attempted"
          
          # Calculate size
          if [ -f "${OUTPUT_DIR}/microos-0.1.0-x86_64.iso" ]; then
            ISO_SIZE=$(stat -c%s "${OUTPUT_DIR}/microos-0.1.0-x86_64.iso")
            ISO_SIZE_MB=$((ISO_SIZE / 1024 / 1024))
            echo "ISO created: ${ISO_SIZE_MB}MB"
          else
            echo "ISO creation may need manual build on Alpine system"
            # Create a placeholder tarball of the rootfs instead
            cd "${ROOTFS_DIR}"
            tar -czf "${OUTPUT_DIR}/microos-0.1.0-rootfs.tar.gz" .
            cd -
            echo "Rootfs tarball created as fallback"
          fi
      
      - name: Verify ISO
        run: |
          ISO_FILE="microos-${{ env.MICROOS_VERSION }}-x86_64.iso"
          if [ -f "/tmp/microos-output/${ISO_FILE}" ]; then
            ISO_SIZE=$(stat -c%s "/tmp/microos-output/${ISO_FILE}")
            ISO_SIZE_MB=$((ISO_SIZE / 1024 / 1024))
            echo "ISO size: ${ISO_SIZE_MB}MB"
            
            if [ "${ISO_SIZE_MB}" -le 200 ]; then
              echo "✅ ISO is under 200MB target!"
            else
              echo "⚠️ ISO exceeds 200MB target - needs optimization"
            fi
          else
            echo "❌ ISO not found!"
            exit 1
          fi
      
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: microos-iso-amd64
          path: /tmp/microos-output/microos-${{ env.MICROOS_VERSION }}-x86_64.iso
          retention-days: 30
      
      - name: Upload ISO SHA256 checksum
        run: |
          sha256sum /tmp/microos-output/microos-${{ env.MICROOS_VERSION }}-x86_64.iso > \
            /tmp/microos-output/microos-${{ env.MICROOS_VERSION }}-x86_64.iso.sha256
      
      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: microos-checksum-amd64
          path: /tmp/microos-output/microos-${{ env.MICROOS_VERSION }}-x86_64.iso.sha256
          retention-days: 30

  # ============================================================================
  # Job 3: Publish Release (on version tags only)
  # ============================================================================
  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-api, build-iso]
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: "MicroOS ${{ github.ref_name }}"
          body: |
            ## MicroOS Video Streaming Server ${{ github.ref_name }}
            
            ### 🎯 What's New
            - Ultra-light headless OS for video hosting & streaming
            - ISO size under 200MB, RAM consumption under 200MB
            - GPU-accelerated transcoding (VA-API, NVENC, Vulkan AV1)
            - HLS/DASH adaptive streaming support
            - Single Go binary API for complete management
            
            ### 📦 Downloads
            
            | Architecture | ISO | API Binary |
            |-------------|-----|-----------|
            | x86_64 | `microos-${{ env.MICROOS_VERSION }}-x86_64.iso` | `microos-server-amd64` |
            | ARM64 | `microos-${{ env.MICROOS_VERSION }}-aarch64.iso` | `microos-server-arm64` |
            
            ### 🚀 Quick Start
            ```bash
            # Download and flash ISO to USB
            dd if=microos-*.iso of=/dev/sdX bs=4M
            
            # Boot the USB on your server
            # MicroOS starts automatically with API on port 8080
            
            # Upload a video
            curl -X POST http://your-server:8080/api/v1/upload \
              -F "video=@your-video.mp4"
            
            # Get streaming URL
            curl http://your-server:8080/api/v1/videos/{id}/stream
            ```
            
            ### ⚙️ System Requirements
            - Minimum RAM: 256MB (200MB OS + 56MB for processing)
            - Recommended: 1GB+ for concurrent transcoding
            - GPU: Optional (Intel/AMD VA-API, NVIDIA NVENC, Vulkan)
            - Storage: 10GB+ for video library
            
            ---
            Built with ❤️ for video hosting companies, data centers, and streaming platforms.
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          files: |
            release-artifacts/microos-iso-amd64/*
            release-artifacts/api-binary-amd64/*
            release-artifacts/api-binary-arm64/*

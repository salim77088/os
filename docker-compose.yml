# MicroOS Development Docker Compose
# For local testing and development only

services:
  microos-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: microos-dev
    ports:
      - "8080:8080"
    volumes:
      - microos-data:/var/lib/microos
      - /dev/dri:/dev/dri  # GPU access (if available)
    environment:
      - MICROOS_HOST=0.0.0.0
      - MICROOS_PORT=8080
      - MICROOS_STORAGE_PATH=/var/lib/microos
      - MICROOS_DB_PATH=/var/lib/microos/microos.db
      - MICROOS_GPU=auto
      - MICROOS_CODEC=av1
      - MICROOS_WORKERS=2
      - MICROOS_AUTH=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  microos-data:
    driver: local
